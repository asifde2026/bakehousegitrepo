# This is a Declarative Automation Bundle definition for bakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse
  uuid: 8eb3f459-bcda-4ae4-8cf7-23e29faa02c4

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7f9933bd-f699.cloud.databricks.com
    variables:
      catalog: bakehouse_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-7f9933bd-f699.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/asif.de2026@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/asif.de2026@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_dev
      schema: rnd
    permissions:
      - user_name: asif.de2026@gmail.com
        level: CAN_MANAGE
