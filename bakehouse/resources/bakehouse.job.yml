# A sample job for bakehouse.

resources:
  jobs:
    bakehouse_job:
      name: bakehouse_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/bakehouse_notebook.ipynb
        - task_key: transaction_summary
          depends_on:
            - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/transactions_summary
    
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
